name: phylogicndt_py3
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - setuptools
  - wheel
  # scientific stack from conda
  - numpy=1.24.2
  - scipy=1.10.1
  - pandas=1.5.3
  - matplotlib=3.6.3
  - seaborn=0.12.2
  - scikit-learn=1.3.0
  - networkx=2.8.8
  - intervaltree=2.1.0
  - graphviz
  - python-graphviz
  # optional R support
  - r-base=4.3
  - pip:
      - sselogsumexp @ git+https://github.com/rmcgibbo/logsumexp.git
